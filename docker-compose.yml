services:
  voice-scheduling-agent:
    build: .
    container_name: voice-scheduling-agent
    env_file:
      - .env
    ports:
      # - "127.0.0.1:${HOST_PORT:-8001}:8000"
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
